document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

--shadow:0 1px 2px rgba(18,53,44,.06); --bggrad:#f4f8f6; --themecolor:#2f6f5e;\n}\n/* 3 · Coral Suave */\n[data-theme=\"coral-suave\"]{\n  color-scheme:light;\n  --ink:#4a2b2b; --muted:#9b7a76; --line:#f3ddd7;\n  --surface:#ffffff; --surface-2:#fdf1ee; --solid:#ffffff;\n  --accent:#e8837a; --accent-ink:#ffffff;\n  --income:#4fa87d; --expense:#e05c5c; --debt:#e3a72c; --transfer:#4fa8b8; --cardcol:#5b8fd6;\n  --field:#ffffff; --hover:#fbe8e3;\n  --shadow:0 1px 2px rgba(74,43,43,.06); --bggrad:#fdf5f2; --themecolor:#e8837a;\n}\n/* 4 · Azul Intenso */\n[data-theme=\"azul-intenso\"]{\n  color-scheme:dark;\n  --ink:#eaf1fb; --muted:#8ba0bd; --line:#22334d;\n  --surface:#14243a; --surface-2:#1a2c46; --solid:#14243a;\n  --accent:#2f8fff; --accent-ink:#04182e;\n  --income:#3ecf8e; --expense:#ff5c72; --debt:#ffc94d; --transfer:#4dd0e1; --cardcol:#5aa9ff;\n  --field:#1a2c46; --hover:#22334d;\n  --shadow:none; --bggrad:#0f1b2d; --themecolor:#0f1b2d;\n}\n/* 5 · Arena Serena */\n[data-theme=\"arena-serena\"]{\n  color-scheme:light;\n  --ink:#3a2f22; --muted:#8a7a63; --line:#e6dccb;\n  --surface:#ffffff; --surface-2:#f6f1e9; --solid:#ffffff;\n  --accent:#b98a4e; --accent-ink:#ffffff;\n  --income:#5f9455; --expense:#c2493f; --debt:#c9a02c; --transfer:#5b8f92; --cardcol:#5a7d9a;\n  --field:#ffffff; --hover:#f0e8da;\n  --shadow:0 1px 2px rgba(58,47,34,.07); --bggrad:#f9f5ee; --themecolor:#b98a4e;\n}\n*{box-sizing:border-box}\nhtml,body{margin:0}\nbody{font-family:'Inter',system-ui,sans-serif; color:var(--ink); min-height:100vh; background:var(--bggrad); background-attachment:fixed; -webkit-font-smoothing:antialiased}\n.num{font-family:'Space Grotesk',sans-serif; font-variant-numeric:tabular-nums; letter-spacing:-.01em}\n.wrap{max-width:900px; margin:0 auto; padding:16px 15px 120px}\nh1,h2,h3{margin:0}\nbutton{font-family:inherit; cursor:pointer}\ninput,select{font-family:inherit; font-size:15px}\n.hidden{display:none !important}\n\n.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); backdrop-filter:var(--glass); -webkit-backdrop-filter:var(--glass)}\n.btn{border:none; background:var(--accent); color:var(--accent-ink); border-radius:12px; padding:12px 16px; font-weight:700; font-size:14px}\n.btn:hover{filter:brightness(1.05)}\n.btn.dark{background:var(--ink); color:var(--solid)}\n.btn.ghost{background:var(--surface-2); color:var(--ink); border:1px solid var(--line)}\n.btn.sm{padding:8px 12px; font-size:13px; border-radius:10px}\n.field{display:flex; flex-direction:column; gap:6px}\n.field label{font-size:12px; color:var(--muted); font-weight:500}\n.field input,.field select{border:1px solid var(--line); border-radius:12px; padding:11px 13px; background:var(--field); color:var(--ink); width:100%}\n.field input:focus,.field select:focus{outline:2px solid var(--accent); border-color:transparent}\nselect option, .filters select option{background:var(--solid); color:var(--ink)}\n.grid2{display:grid; grid-template-columns:1fr 1fr; gap:12px}\n.cta{width:100%; margin-top:4px}\n.mt{margin-top:16px}\n.pad{padding:18px}\n\n.center{min-height:100vh; display:grid; place-items:center; padding:20px}\n.panel{width:100%; max-width:410px; padding:26px}\n.panel h1{font-family:'Space Grotesk'; font-size:24px; margin-bottom:4px}\n.panel p.sub{color:var(--muted); font-size:14px; margin:0 0 20px}\n.err{color:var(--expense); font-size:13px; min-height:18px; margin-top:4px}\n.linkbtn{background:none; border:none; color:var(--accent); font-weight:600; font-size:13px; padding:0}\n.setup-steps{font-size:13.5px; color:var(--muted); line-height:1.6; margin:0; padding-left:18px}\n.setup-steps code{background:var(--hover); padding:1px 5px; border-radius:5px; color:var(--ink); font-size:12.5px}\n.logo-auth{width:56px; height:auto; display:block; margin-bottom:16px; color:var(--accent)}\n\n.top{display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; padding-top:6px}\n.brand{display:flex; align-items:center; gap:11px}\n.brand svg.logo{width:34px; height:auto; color:var(--accent)}\n.brand h1{font-family:'Space Grotesk'; font-size:18px}\n.who{font-size:12px; color:var(--muted)}\n.top-actions{display:flex; gap:8px; align-items:center}\n.icon-btn{width:40px; height:40px; border-radius:12px; border:1px solid var(--line); background:var(--surface); color:var(--ink); font-size:16px; display:grid; place-items:center; backdrop-filter:var(--glass)}\n.icon-btn:hover{background:var(--hover)}\n.me-btn{width:40px; height:40px; border-radius:50%; border:1px solid var(--line); overflow:hidden; background:var(--accent); color:var(--accent-ink); font-weight:700; display:grid; place-items:center; padding:0}\n.me-btn img{width:100%; height:100%; object-fit:cover}\n\n.hero{padding:24px; margin-bottom:14px; position:relative; overflow:hidden}\n.hero .lbl{font-size:12px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); font-weight:600}\n.hero .total{font-size:46px; font-weight:700; margin:8px 0 6px; line-height:1}\n.hero .other{font-size:13px; color:var(--muted); margin-bottom:14px; min-height:0}\n.chips{display:flex; gap:8px; flex-wrap:wrap}\n.chip{background:var(--surface-2); border:1px solid var(--line); border-radius:14px; padding:10px 13px; min-width:116px}\n.chip .k{font-size:11px; color:var(--muted); font-weight:600}\n.chip .v{font-size:16px; font-weight:700; margin-top:2px}\n.curbadge{font-size:10px; font-weight:700; letter-spacing:.04em; color:var(--muted); border:1px solid var(--line); border-radius:6px; padding:1px 5px; margin-left:6px; vertical-align:middle}\n\n.msum{display:grid; grid-template-columns:repeat(3,1fr); margin-bottom:14px; overflow:hidden}\n.msum .cell{padding:16px; border-right:1px solid var(--line)}\n.msum .cell:last-child{border-right:none}\n.msum .k{font-size:11px; color:var(--muted); font-weight:600; text-transform:uppercase; letter-spacing:.05em}\n.msum .v{font-size:19px; font-weight:700; margin-top:4px}\n.delta{font-size:12px; margin-top:3px; font-weight:600}\n.delta.up{color:var(--expense)} .delta.down{color:var(--income)}\n\n.tabs{display:flex; gap:5px; background:var(--surface-2); padding:5px; border-radius:16px; margin-bottom:16px; overflow-x:auto; border:1px solid var(--line); backdrop-filter:var(--glass)}\n.tabs button{flex:1 0 auto; border:none; background:transparent; padding:10px 13px; border-radius:11px; font-weight:600; font-size:13.5px; color:var(--muted); white-space:nowrap}\n.tabs button.active{background:var(--accent); color:var(--accent-ink)}\n\n.sec-title{font-family:'Space Grotesk'; font-size:15px; font-weight:600; margin:2px 0 12px}\n.list{display:flex; flex-direction:column}\n.item{display:flex; align-items:center; gap:12px; padding:13px 4px; border-bottom:1px solid var(--line)}\n.item:last-child{border-bottom:none}\n.item .meta{flex:1; min-width:0}\n.item .desc{font-weight:600; font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}\n.item .subm{font-size:12px; color:var(--muted); margin-top:2px}\n.item .amt{font-weight:700; font-size:15px; white-space:nowrap}\n.amt.in{color:var(--income)} .amt.out{color:var(--expense)} .amt.tr{color:var(--transfer)}\n.badge{font-size:11px; padding:2px 8px; border-radius:999px; background:var(--hover); color:var(--muted); font-weight:600}\n.empty{color:var(--muted); font-size:14px; text-align:center; padding:26px 0}\n.iconx{background:none; border:none; color:var(--muted); font-size:16px; padding:4px 5px; border-radius:8px}\n.iconx:hover{color:var(--ink); background:var(--hover)}\n.month-head{font-size:12px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; margin:14px 0 4px}\n.paid-btn{border:1px solid var(--line); background:var(--surface-2); border-radius:10px; padding:6px 10px; font-size:12px; font-weight:600; color:var(--muted)}\n.paid-btn.done{background:var(--income); color:#04210a; border-color:transparent}\n\n.filters{display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap}\n.filters input,.filters select{border:1px solid var(--line); border-radius:11px; padding:9px 11px; background:var(--field); color:var(--ink)}\n.filters input{flex:1; min-width:130px}\n\n.brow{padding:13px 4px; border-bottom:1px solid var(--line)}\n.brow:last-child{border-bottom:none}\n.bhead{display:flex; align-items:center; gap:10px; justify-content:space-between}\n.bname{font-weight:600; font-size:14px}\ninput.lim{width:120px; border:1px solid var(--line); border-radius:10px; padding:7px 10px; background:var(--field); color:var(--ink); text-align:right}\n.bar{height:8px; border-radius:6px; background:var(--hover); margin-top:8px; overflow:hidden}\n.bar>span{display:block; height:100%; border-radius:6px; background:var(--accent)}\n.bar.over>span{background:var(--expense)}\n.bmeta{font-size:12px; color:var(--muted); margin-top:5px}\n\n.divhero{padding:22px; margin-bottom:14px; text-align:center}\n.divhero .lbl{font-size:12px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); font-weight:600}\n.divhero .big{font-size:40px; font-weight:700; margin-top:6px}\n.avatar{width:40px; height:40px; border-radius:50%; background:var(--accent); color:var(--accent-ink); display:grid; place-items:center; font-weight:700; font-size:15px; flex-shrink:0; overflow:hidden}\n.avatar img{width:100%; height:100%; object-fit:cover}\n.contact-row{display:flex; align-items:center; gap:12px; padding:14px 4px; border-bottom:1px solid var(--line)}\n.contact-row:last-child{border-bottom:none}\n.cbal{font-weight:700; font-size:15px}\n\n/* tarjetas */\n.cardchip{width:34px; height:22px; border-radius:5px; display:inline-grid; place-items:center; background:var(--surface-2); border:1px solid var(--line)}\n.brand-visa{font-family:'Space Grotesk'; font-style:italic; font-weight:700; color:#1a1f71; background:#fff; border-radius:4px; padding:1px 5px; font-size:11px}\n[data-theme=\"verde-noche\"] .brand-visa,[data-theme=\"azul-intenso\"] .brand-visa{color:#1434cb; background:#eef1ff}\n\n/* calendario */\n.calnav{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px}\n.calnav .cbtn{width:38px; height:38px; border-radius:10px; border:1px solid var(--line); background:var(--surface-2); color:var(--ink); font-size:18px}\n.calnav .ctitle{font-family:'Space Grotesk'; font-weight:600; font-size:16px; text-transform:capitalize}\n.caltot{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:6px}\n\n/* legend for pie */\n.legend{display:flex; flex-direction:column; gap:6px; margin-top:14px}\n.legrow{display:flex; align-items:center; gap:9px; font-size:13px}\n.swatch{width:12px; height:12px; border-radius:3px; flex-shrink:0}\n.legrow .lname{flex:1}\n.legrow .lval{color:var(--muted); font-variant-numeric:tabular-nums}\n\n/* FAB */\n.fab{position:fixed; left:50%; transform:translateX(-50%); bottom:20px; z-index:40;\n  background:var(--accent); color:var(--accent-ink); border:none; border-radius:999px;\n  padding:13px 22px; font-weight:700; font-size:15px; box-shadow:0 10px 30px rgba(29,234,0,.35);\n  display:flex; align-items:center; gap:8px; backdrop-filter:blur(6px)}\n.fab:hover{filter:brightness(1.05)}\n.fab .plus{font-size:19px; line-height:1}\n\n.overlay{position:fixed; inset:0; background:rgba(0,0,0,.5); backdrop-filter:blur(4px); display:grid; place-items:center; padding:16px; z-index:60}\n.modal{width:100%; max-width:440px; padding:22px; background:var(--solid); border:1px solid var(--line); border-radius:22px; max-height:92vh; overflow:auto}\n.modal h3{font-family:'Space Grotesk'; margin-bottom:14px}\n.modal .row2{display:flex; gap:10px; margin-top:16px}\n.photo-pick{display:flex; align-items:center; gap:14px; margin-bottom:14px}\n.photo-prev{width:64px; height:64px; border-radius:50%; overflow:hidden; background:var(--accent); color:var(--accent-ink); display:grid; place-items:center; font-weight:700; font-size:22px; flex-shrink:0}\n.photo-prev img{width:100%; height:100%; object-fit:cover}\n\ncanvas{max-height:280px}\n.hint{font-size:12.5px; color:var(--muted); margin-top:8px}\n.total-fijos{font-size:13px; color:var(--muted); margin-top:10px}\n\n/* ===== Home nuevo ===== */\n.apphead{display:flex; align-items:center; gap:10px; margin-bottom:18px; padding-top:6px}\n.monthsel{flex:1; display:flex; justify-content:center}\n.monthsel select{appearance:none; -webkit-appearance:none; background:transparent; border:none; color:var(--ink);\n  font-family:'Space Grotesk',sans-serif; font-size:19px; font-weight:600; text-align:center; text-align-last:center;\n  padding:6px 26px 6px 10px; border-radius:12px; text-transform:capitalize; cursor:pointer;\n  background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);\n  background-position:calc(100% - 13px) 55%, calc(100% - 8px) 55%; background-size:5px 5px,5px 5px; background-repeat:no-repeat}\n.monthsel select:hover{background-color:var(--hover)}\n\n.balhead{display:flex; align-items:flex-end; justify-content:space-between; gap:14px; margin-bottom:18px}\n.balhead .lbl{font-size:15px; font-weight:600; color:var(--muted)}\n.balhead .total{font-size:44px; font-weight:700; line-height:1.05; margin-top:2px}\n.roundadd{width:58px; height:58px; border-radius:50%; border:none; background:var(--accent); color:var(--accent-ink);\n  font-size:30px; line-height:1; display:grid; place-items:center; flex-shrink:0; box-shadow:var(--shadow)}\n.roundadd:hover{filter:brightness(1.06)}\n.roundadd.sm{width:46px; height:46px; font-size:24px}\n\n.statcard{display:flex; align-items:center; gap:16px; width:100%; text-align:left; border:none;\n  border-radius:18px; padding:18px; margin-bottom:12px; color:var(--ink)}\n.statcard .sico{width:44px; height:44px; border-radius:12px; display:grid; place-items:center; flex-shrink:0}\n.statcard .st{flex:1; min-width:0}\n.statcard .st b{display:block; font-size:16px; font-weight:700}\n.statcard .st .v{display:block; font-family:'Space Grotesk',sans-serif; font-size:22px; font-weight:700; margin-top:3px; font-variant-numeric:tabular-nums}\n.statcard .arr{font-size:22px; font-weight:700}\n.statcard:hover{filter:brightness(.97)}\n\n.botnav{position:fixed; left:0; right:0; bottom:0; z-index:35; display:flex;\n  background:var(--solid); border-top:1px solid var(--line); padding:6px 4px calc(6px + env(safe-area-inset-bottom))}\n.botnav button{flex:1; border:none; background:transparent; color:var(--muted); padding:7px 2px; border-radius:12px;\n  display:flex; flex-direction:column; align-items:center; gap:3px; font-size:10.5px; font-weight:600}\n.botnav button .bi{font-size:19px; line-height:1}\n.botnav button.active{color:var(--accent)}\n\n.fab{position:fixed; right:18px; bottom:calc(78px + env(safe-area-inset-bottom)); z-index:38;\n  width:60px; height:60px; border-radius:50%; border:none; background:var(--accent); color:var(--accent-ink);\n  font-size:32px; line-height:1; display:grid; place-items:center; box-shadow:0 6px 18px rgba(0,0,0,.28)}\n.fab:hover{filter:brightness(1.06)}\n\n/* ===== Calendario en grilla ===== */\n.calbar{display:flex; align-items:center; gap:10px; margin-bottom:16px; padding-top:6px}\n.calpill{flex:1; display:flex; align-items:center; justify-content:center; gap:14px;\n  background:var(--surface-2); border:1px solid var(--line); border-radius:999px; padding:9px 14px}\n.calpill b{font-family:'Space Grotesk',sans-serif; font-size:17px; font-weight:600; text-transform:capitalize; min-width:120px; text-align:center}\n.calpill button{border:none; background:transparent; color:var(--accent); font-size:20px; line-height:1; padding:0 4px}\n.dow{display:grid; grid-template-columns:repeat(7,1fr); gap:0; margin-bottom:6px}\n.dow span{text-align:center; font-size:11px; font-weight:700; letter-spacing:.04em; color:var(--muted)}\n.calgrid{display:grid; grid-template-columns:repeat(7,1fr); border:1px solid var(--line); border-radius:16px; overflow:hidden}\n.calgrid button{border:none; border-right:1px solid var(--line); border-bottom:1px solid var(--line);\n  background:var(--surface); color:var(--ink); min-height:62px; padding:7px 5px 5px; text-align:left;\n  display:flex; flex-direction:column; align-items:flex-start; gap:3px; font-size:13px; font-weight:600}\n.calgrid button:nth-child(7n){border-right:none}\n.calgrid button.off{background:var(--surface-2); color:var(--muted); font-weight:500}\n.calgrid button.today{outline:2px solid var(--accent); outline-offset:-2px}\n.calgrid button:hover{background:var(--hover)}\n.cdots{display:flex; gap:3px; flex-wrap:wrap}\n.cdots i{width:6px; height:6px; border-radius:50%; display:block}\n.calsum{display:flex; gap:8px; flex-wrap:wrap; margin:16px 0 10px}\n\n/* ===== Iconos y animaciones (portado de \"Mis Cuentas · Iconos y Animaciones\") ===== */\n@keyframes mc-in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}\n@keyframes mc-fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}\n@keyframes mc-toast{0%{opacity:0;transform:translateY(18px) scale(.94)}100%{opacity:1;transform:none}}\n@keyframes mc-shimmer{0%{background-position:-180px 0}100%{background-position:280px 0}}\n@keyframes mc-pop{0%{transform:scale(.5);opacity:0}62%{transform:scale(1.1)}100%{transform:scale(1);opacity:1}}\n\n.ic{display:inline-block; vertical-align:middle; flex-shrink:0;\n  transition:transform .28s cubic-bezier(.34,1.3,.44,1), opacity .28s cubic-bezier(.2,0,0,1)}\n.ic svg{display:block}\nbutton:hover > .ic, button:hover .ic{transform:translateY(-1.5px) scale(1.06)}\nbutton:active > .ic, button:active .ic{transform:scale(.94)}\n\n.statcard{animation:mc-in .5s cubic-bezier(.34,1.3,.44,1) both}\n.statcard:nth-of-type(1){animation-delay:.04s}\n.statcard:nth-of-type(2){animation-delay:.10s}\n.statcard:nth-of-type(3){animation-delay:.16s}\n.cfg-row{animation:mc-in .44s cubic-bezier(.34,1.3,.44,1) both}\n.cfg-row:nth-of-type(2){animation-delay:.05s}\n.cfg-row:nth-of-type(3){animation-delay:.10s}\n.cf px; padding-left:16px;\n}\n[data-theme=\"clara\"] #reg .reg-tabs .chipbtn:last-child.on,html:not([data-theme]) #reg .reg-tabs .chipbtn:last-child.on{\n  border-radius:16px 22px 0 0; margin-right:-12px; padding-right:16px;\n}\n[data-theme=\"clara\"] #reg-step1,html:not([data-theme]) #reg-step1{margin-top:0}\n[data-theme=\"clara\"] #reg .reg-sheet,html:not([data-theme]) #reg .reg-sheet{\n  background:var(--surface-2); border-radius:22px 22px 0 0; position:relative; z-index:1;\n}\n[data-theme=\"clara\"] #reg:has(.reg-tabs .chipbtn:first-child.on) #reg-step1,html:not([data-theme]) #reg:has(.reg-tabs .chipbtn:first-child.on) #reg-step1{border-top-left-radius:0}\n[data-theme=\"clara\"] #reg:has(.reg-tabs .chipbtn:last-child.on) #reg-step1,html:not([data-theme]) #reg:has(.reg-tabs .chipbtn:last-child.on) #reg-step1{border-top-right-radius:0}\n/* la fila solo se muestra en el paso 1 */\n[data-theme=\"clara\"] #reg:has(#reg-step1.hidden) .reg-tabs,html:not([data-theme]) #reg:has(#reg-step1.hidden) .reg-tabs{display:none}\n<\u002Fstyle>\n\n<\u002Fhead>\n<body>\n\n<div id=\"setup\" class=\"center hidden\">\n  <div class=\"card panel\"><h1>Falta conectar Supabase<\u002Fh1>\n    <p class=\"sub\">Pegá tu Project URL y anon key arriba del archivo, en <code>SUPABASE_URL<\u002Fcode> y <code>SUPABASE_ANON_KEY<\u002Fcode>.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n\n<div id=\"auth\" class=\"center hidden\">\n  <div class=\"card panel\">\n    <svg class=\"logo-auth\" id=\"logo-auth\" viewBox=\"0 0 1272.84 877.71\" xmlns=\"http://www.w3.org/2000/svg\"><\u002Fsvg>\n    <h1 id=\"auth-title\">Ingresá<\u002Fh1>\n    <p class=\"sub\" id=\"auth-sub\">Tus cuentas, en el celu y en la compu.<\u002Fp>\n    <div class=\"field\" style=\"margin-bottom:12px\"><label>Email<\u002Flabel><input id=\"au-email\" type=\"email\" autocomplete=\"email\" placeholder=\"vos@email.com\"><\u002Fdiv>\n    <div class=\"field\" style=\"margin-bottom:12px\"><label>Contraseña<\u002Flabel><input id=\"au-pass\" type=\"password\" autocomplete=\"current-password\" placeholder=\"••••••••\"><\u002Fdiv>\n    <div class=\"field hidden\" id=\"au-pais-wrap\" style=\"margin-bottom:6px\">\n      <label>¿De qué país sos?<\u002Flabel>\n      <select id=\"au-pais\"><\u002Fselect>\n      <div class=\"hint\" id=\"au-cur-hint\" style=\"margin-top:2px\"><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"err\" id=\"au-err\"><\u002Fdiv>\n    <button class=\"btn\" style=\"width:100%\" id=\"au-submit\">Entrar<\u002Fbutton>\n    <p style=\"text-align:center; margin:14px 0 0; font-size:13px; color:var(--muted)\"><span id=\"au-switch-txt\">¿Primera vez?<\u002Fspan> <button class=\"linkbtn\" id=\"au-switch\">Crear cuenta<\u002Fbutton><\u002Fp>\n    <p style=\"text-align:center; margin:8px 0 0\"><button class=\"linkbtn\" id=\"au-forgot\" style=\"color:var(--muted)\">Olvidé mi clave<\u002Fbutton><\u002Fp>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<div id=\"recovery\" class=\"center hidden\">\n  <div class=\"card panel\"><h1>Nueva contraseña<\u002Fh1><p class=\"sub\">Elegí una clave nueva.<\u002Fp>\n    <div class=\"field\" style=\"margin-bottom:6px\"><label>Nueva contraseña<\u002Flabel><input id=\"rc-pass\" type=\"password\" autocomplete=\"new-password\" placeholder=\"••••••••\"><\u002Fdiv>\n    <div class=\"err\" id=\"rc-err\"><\u002Fdiv><button class=\"btn\" style=\"width:100%\" id=\"rc-save\">Guardar contraseña<\u002Fbutton><\u002Fdiv>\n<\u002Fdiv>\n\n<div id=\"app\" class=\"wrap hidden\">\n  <div class=\"apphead\">\n    <button class=\"icon-btn\" id=\"cal-btn\" title=\"Calendario\" data-ic=\"calendario\"><\u002Fbutton>\n    <div class=\"monthsel\"><select id=\"hm-mes\"><\u002Fselect><\u002Fdiv>\n    <button class=\"icon-btn\" id=\"config-btn\" title=\"Configuración\" data-ic=\"ajustes\"><\u002Fbutton>\n  <\u002Fdiv>\n\n  <!-- INICIO -->\n  <section id=\"tab-home\">\n    <div class=\"balhead\">\n      <div><div class=\"lbl\">Balance Mensual<\u002Fdiv><div class=\"total num\" id=\"h-bal\">$0<\u002Fdiv><div class=\"other\" id=\"h-bal-other\"><\u002Fdiv><\u002Fdiv>\n      <button class=\"roundadd\" id=\"add-top\" title=\"Agregar movimiento\">+<\u002Fbutton>\n    <\u002Fdiv>\n\n    <button class=\"statcard\" data-stat=\"ingreso\" style=\"background:color-mix(in srgb, var(--income) 16%, var(--surface))\">\n      <div class=\"sico\" data-ic=\"ingreso\" data-ic-size=\"22\" style=\"background:color-mix(in srgb, var(--income) 28%, transparent); color:var(--income)\"><\u002Fdiv>\n      <div class=\"st\"><b style=\"color:var(--income)\">Ingresos<\u002Fb><span class=\"v\" id=\"st-ing\">$0<\u002Fspan><\u002Fdiv>\n      <div class=\"arr\" style=\"color:var(--income)\">›<\u002Fdiv>\n    <\u002Fbutton>\n    <button class=\"statcard\" data-stat=\"gasto\" style=\"background:color-mix(in srgb, var(--expense) 16%, var(--surface))\">\n      <div class=\"sico\" data-ic=\"gasto\" data-ic-size=\"22\" style=\"background:color-mix(in srgb, var(--expense) 28%, transparent); color:var(--expense)\"><\u002Fdiv>\n      <div class=\"st\"><b style=\"color:var(--expense)\">Gastos<\u002Fb><span class=\"v\" id=\"st-gas\">$0<\u002Fspan><span class=\"delta\" id=\"s-delta\"><\u002Fspan><\u002Fdiv>\n      <div class=\"arr\" style=\"color:var(--expense)\">›<\u002Fdiv>\n    <\u002Fbutton>\n    <button class=\"statcard\" data-stat=\"ahorro\" style=\"background:color-mix(in srgb, var(--debt) 16%, var(--surface))\">\n      <div class=\"sico\" data-ic=\"billetera\" data-ic-size=\"22\" style=\"background:color-mix(in srgb, var(--debt) 28%, transparent); color:var(--debt)\"><\u002Fdiv>\n      <div class=\"st\"><b style=\"color:var(--debt)\">Ahorros<\u002Fb><span class=\"v\" id=\"st-aho\">$0<\u002Fspan><\u002Fdiv>\n      <div class=\"arr\" style=\"color:var(--debt)\">›<\u002Fdiv>\n    <\u002Fbutton>\n\n    <div class=\"sec-title\" style=\"margin:22px 0 12px; font-size:17px\">Mis Presupuestos<\u002Fdiv>\n    <div class=\"card pad\" style=\"margin-bottom:14px; text-align:center; padding:34px 18px\">\n      <div style=\"color:var(--muted)\" data-ic=\"alerta\" data-ic-size=\"34\"><\u002Fdiv>\n      <div style=\"font-family:'Space Grotesk'; font-size:17px; font-weight:600; margin-top:10px\">Próximamente<\u002Fdiv>\n      <p class=\"hint\" style=\"max-width:320px; margin:6px auto 0\">Acá vas a poder ponerle un límite mensual a cada categoría y ver cuánto llevás gastado.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- DIVIDIR -->\n  <section id=\"tab-div\" class=\"hidden\">\n    <div class=\"card divhero\"><div class=\"lbl\">Balance de gastos compartidos<\u002Fdiv>\n      <div class=\"big num\" id=\"div-net\">$0<\u002Fdiv><div class=\"who\" id=\"div-net-lbl\">En cero<\u002Fdiv><\u002Fdiv>\n    <div class=\"card pad\" style=\"margin-bottom:14px\">\n      <div class=\"sec-title\">Compartir gastos con alguien<\u002Fdiv>\n      <p class=\"hint\" style=\"margin-top:0\">Escribí su mail. Tiene que tener cuenta en la app y haber entrado al menos una vez.<\u002Fp>\n      <div class=\"filters\" style=\"margin-top:10px\">\n        <input id=\"link-email\" type=\"email\" placeholder=\"correo@ejemplo.com\">\n        <button class=\"btn sm\" id=\"link-search\">Buscar<\u002Fbutton>\n      <\u002Fdiv>\n      <div id=\"link-result\" style=\"margin-top:8px\"><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"card pad\" style=\"margin-bottom:14px\">\n      <div class=\"sec-title\">Compartís con<\u002Fdiv>\n      <div class=\"list\" id=\"pairs-list\"><div class=\"empty\">Todavía no compartís gastos con nadie.<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"card pad hidden\" id=\"pair-detail\">\n      <div style=\"display:flex; justify-content:space-between; align-items:center; margin-bottom:6px\">\n        <div class=\"sec-title\" style=\"margin:0\" id=\"pair-title\">Gastos con —<\u002Fdiv>\n        <button class=\"btn sm\" id=\"add-shared-btn\">+ Gasto<\u002Fbutton>\n      <\u002Fdiv>\n      <div class=\"who\" id=\"pair-balance\" style=\"margin-bottom:8px\"><\u002Fdiv>\n      <div class=\"list\" id=\"pair-txns\"><div class=\"empty\">Sin gastos todavía.<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- TARJETAS -->\n  <section id=\"tab-tar\" class=\"hidden\">\n    <div class=\"card pad\" style=\"margin-bottom:14px\">\n      <div class=\"sec-title\">Nueva compra con tarjeta<\u002Fdiv>\n      <div class=\"grid2\">\n        <div class=\"field\"><label>Fecha de compra<\u002Flabel><input id=\"c-fecha\" type=\"date\"><\u002Fdiv>\n        <div class=\"field\"><label>Tarjeta<\u002Flabel><select id=\"c-tarjeta\"><\u002Fselect><\u002Fdiv>\n        <div class=\"field\"><label>Monto total<\u002Flabel><input id=\"c-monto\" type=\"number\" inputmode=\"decimal\" placeholder=\"0\"><\u002Fdiv>\n        <div class=\"field\"><label>Cuotas<\u002Flabel><input id=\"c-cuotas\" type=\"number\" inputmode=\"numeric\" value=\"1\" min=\"1\"><\u002Fdiv>\n        <div class=\"field\"><label>Categoría<\u002Flabel><select id=\"c-cat\"><\u002Fselect><\u002Fdiv>\n        <div class=\"field\"><label>Descripción<\u002Flabel><input id=\"c-desc\" type=\"text\" placeholder=\"Ej: Zapatillas\"><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"who\" id=\"c-preview\" style=\"margin-top:10px\"><\u002Fdiv>\n      <button class=\"btn cta mt\" id=\"c-add\">Agregar compra<\u002Fbutton>\n    <\u002Fdiv>\n    <div class=\"card pad\" style=\"margin-bottom:14px\">\n      <div class=\"sec-title\">Proyección: cuánto pagás por mes<\u002Fdiv>\n      <canvas id=\"chart-proj\"><\u002Fcanvas><div class=\"hint\" id=\"proj-hint\"><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"card pad\"><div class=\"sec-title\">Cuotas<\u002Fdiv>\n      <div class=\"list\" id=\"cuotas-list\"><div class=\"empty\">Todavía no hay compras en cuotas.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- GRÁFICOS -->\n  <section id=\"tab-graf\" class=\"hidden\">\n    <div class=\"card pad\" style=\"margin-bottom:14px\">\n      <div class=\"sec-title\">Plata total<\u002Fdiv>\n      <div class=\"total num\" id=\"h-total\" style=\"font-size:34px; font-weight:700; margin:4px 0 4px\">$0<\u002Fdiv>\n      <div class=\"other\" id=\"h-other\"><\u002Fdiv>\n      <div class=\"chips\" id=\"hero-chips\" style=\"margin-top:10px\"><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"card pad\" style=\"margin-bottom:14px\">\n      <div style=\"display:flex; justify-content:space-between; align-items:center\">\n        <div class=\"sec-title\" style=\"margin:0\">Descargar tu reporte<\u002Fdiv>\n        <button class=\"btn ghost sm\" id=\"export-btn\" style=\"display:flex; align-items:center; gap:7px\"><span data-ic=\"exportar\" data-ic-size=\"16\"><\u002Fspan>CSV<\u002Fbutton>\n      <\u002Fdiv>\n      <p class=\"hint\">Se baja todo tu historial de movimientos, con la moneda de cada cuenta.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"card pad\" style=\"margin-bottom:14px\"><div class=\"sec-title\">Ingresos vs. gastos por mes<\u002Fdiv><canvas id=\"chart-flow\"><\u002Fcanvas><\u002Fdiv>\n    <div class=\"card pad\">\n      <div class=\"sec-title\">Gastos por categoría (este mes)<\u002Fdiv>\n      <canvas id=\"chart-cat\"><\u002Fcanvas>\n      <div class=\"legend\" id=\"cat-legend\"><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n<\u002Fdiv>\n\n<!-- barra inferior + botón flotante -->\n<nav class=\"botnav hidden\" id=\"botnav\">\n  <button data-tab=\"home\" class=\"active\"><span class=\"bi\" data-ic=\"casa\" data-ic-size=\"21\"><\u002Fspan>Inicio<\u002Fbutton>\n  <button data-tab=\"tar\"><span class=\"bi\" data-ic=\"tarjeta\" data-ic-size=\"21\"><\u002Fspan>Tarjetas<\u002Fbutton>\n  <button data-tab=\"div\"><span class=\"bi\" data-ic=\"dividir\" data-ic-size=\"21\"><\u002Fspan>Dividir<\u002Fbutton>\n  <button data-tab=\"graf\"><span class=\"bi\" data-ic=\"grafico\" data-ic-size=\"21\"><\u002Fspan>Gráficos<\u002Fbutton>\n<\u002Fnav>\n<button class=\"fab hidden\" id=\"fab\" title=\"Agregar movimiento\">+<\u002Fbutton>\n\n<!-- ===================== CALENDARIO ===================== -->\n<div id=\"calendar\" class=\  uruguayo\"},\n  {c:\"VES\", n:\"Bolívar\"},\n  {c:\"USDT\", n:\"USDT (cripto)\", crypto:true, dec:2, sym:\"USDT \"},\n  {c:\"USDC\", n:\"USDC (cripto)\", crypto:true, dec:2, sym:\"USDC \"},\n  {c:\"BTC\",  n:\"Bitcoin\",       crypto:true, dec:8, sym:\"₿ \"},\n  {c:\"ETH\",  n:\"Ethereum\",      crypto:true, dec:6, sym:\"Ξ \"}\n];\nconst PAIS_MAP = Object.fromEntries(PAISES.map(p=>[p.c,p]));\nconst MON_MAP  = Object.fromEntries(MONEDAS.map(m=>[m.c,m]));\nconst DEFAULT_CUR = \"ARS\", DEFAULT_LOC = \"es-AR\";\n\nlet CTA_NOMBRE = {};\nconst $ = id => document.getElementById(id);\nconst todayISO = () => new Date().toISOString().slice(0,10);\nconst curMonth = () => new Date().toISOString().slice(0,7);\nconst prevMonth = () => { const d=new Date(); d.setDate(1); d.setMonth(d.getMonth()-1); return d.toISOString().slice(0,7); };\n\nlet sb=null, user=null, PROFILE=null;\nlet TX=[], PURCH=[], INST=[], BUD=[], REC=[], TRF=[], CARDS=[], PAIRS=[], STXN=[], OTHERPROF={}, ACCOUNTS=[];\nlet activePairId=null, linkFound=null, editingShared=null;\nlet chartFlow=null, chartCat=null, chartProj=null;\nlet editing=null, editingTr=null;\nlet VMONTH = curMonth();          // mes que se está mirando (header, presupuestos, calendario)\nlet calDay = null;                // día seleccionado en el calendario (YYYY-MM-DD)\nlet detStat = \"gasto\";            // qué muestra la pantalla de detalle\nlet homeTab = \"home\";             // pestaña activa de la barra inferior\nlet ctFile=null, pfFile=null;\n\n// ---------- formato de moneda ----------\n// Usuarios que ya existían no tienen moneda guardada -> siguen viendo ARS, igual que antes.\nfunction mainCur(){ return (PROFILE && PROFILE.moneda) || DEFAULT_CUR; }\nfunction mainLoc(){ const p = (PROFILE && PROFILE.pais) ? PAIS_MAP[PROFILE.pais] : null; return (p && p.loc) || DEFAULT_LOC; }\nfunction accCur(key){ const a = ACCOUNTS.find(x=>x.key===key); return (a && a.moneda) || mainCur(); }\nfunction fmtCur(n, cur, conDecimales){\n  cur = cur || mainCur(); n = Number(n)||0;\n  const m = MON_MAP[cur], loc = mainLoc();\n  if(m && m.crypto){\n    const d = conDecimales ? m.dec : Math.min(m.dec, 2);\n    return m.sym + new Intl.NumberFormat(loc,{minimumFractionDigits:0, maximumFractionDigits:d}).format(n);\n  }\n  try{ return new Intl.NumberFormat(loc,{style:'currency', currency:cur, maximumFractionDigits: conDecimales?2:0}).format(n); }\n  catch(e){ return cur + \" \" + new Intl.NumberFormat(loc,{maximumFractionDigits: conDecimales?2:0}).format(n); }\n}\nconst fmt  = (n, cur) => fmtCur(n, cur, false);\nconst fmt2 = (n, cur) => fmtCur(n, cur, true);\nfunction esMonedaPrincipal(cuentaKey){ return accCur(cuentaKey) === mainCur(); }\nfunction monedaLabel(code){ const m=MON_MAP[code]; return code + (m ? \" · \" + m.n : \"\"); }\n\nfunction fillPaisSelect(sel, valor){\n  const s=$(sel); if(!s) return;\n  s.innerHTML = PAISES.map(p=>`<option value=\"${p.c}\">${p.f} ${p.n} — ${p.cur}<\u002Foption>`).join(\"\");\n  if(valor && PAIS_MAP[valor]) s.value=valor;\n}\nfunction fillMonedaSelect(sel, valor){\n  const s=$(sel); if(!s) return;\n  s.innerHTML = MONEDAS.map(m=>`<option value=\"${m.c}\">${m.c} · ${m.n}<\u002Foption>`).join(\"\");\n  if(valor && MON_MAP[valor]) s.value=valor;\n}\n\nfunction configured(){ return SUPABASE_URL.startsWith(\"http\") && SUPABASE_ANON_KEY.length>20; }\n// Vistas de pantalla completa. \"app\" es la de siempre (con barra inferior y botón +).\nconst PANTALLAS=[\"app\",\"config\",\"calendar\",\"detail\",\"reg\"];\nfunction goto(v){\n  PANTALLAS.forEach(id=>$(id).classList.toggle(\"hidden\", id!==v));\n  const enApp = v===\"app\";\n  $(\"botnav\").classList.toggle(\"hidden\", !enApp);\n  // el + no aparece ni en configuración ni mientras cargás un movimiento\n  $(\"fab\").classList.toggle(\"hidden\", !(enApp || v===\"calendar\" || v===\"detail\"));\n  window.scrollTo(0,0);\n}\nfunction show(w){\n  [\"setup\",\"auth\",\"recovery\",\"app\"].forEach(id=>$(id).classList.toggle(\"hidden\", id!==w));\n  [\"config\",\"calendar\",\"detail\",\"reg\"].forEach(id=>$(id).classList.add(\"hidden\"));\n  const enApp = w===\"app\";\n  $(\"botnav\").classList.toggle(\"hidden\", !enApp);\n  $(\"fab\").classList.toggle(\"hidden\", !enApp);\n}\nlet recoveryMode = /type=recovery/.test(window.location.hash);\n\n// logo\n[\"logo-auth\",\"logo-top\"].forEach(id=>{ const el=$(id); if(el) el.innerHTML=LOGO_PATHS; });\nif($(\"app-ver\")) $(\"app-ver\").textContent=APP_VERSION;\n// pinta los iconos declarados con data-ic (no toca ninguna lógica)\nfunction pintarIconos(raiz){ (raiz||document).querySelectorAll(\"[data-ic]\").forEach(el=>{\n  el.innerHTML = icon(el.dataset.ic, parseInt(el.dataset.icSize)||20); }); }\npintarIconos();\n\n// ---------- temas ----------\nfunction temaValido(t){ return TEMAS.some(x=>x.id===t) ? t : (t===\"light\" ? \"teal-claro\" : TEMA_DEFAULT); } // \"dark\"/\"light\" viejos se migran\nfunction applyTheme(t){\n  t=temaValido(t);\n  document.documentElement.setAttribute(\"data-theme\", t);\n  const col=getComputedStyle(document.documentElement).getPropertyValue('--themecolor').trim();\n  if(col) document.querySelector('meta[name=theme-color]').setAttribute('content', col);\n  renderThemeGrid();\n}\n(function(){ let t=TEMA_DEFAULT; try{ t=localStorage.getItem(\"theme\")||TEMA_DEFAULT; }catch(e){} applyTheme(t); })();\nfunction renderThemeGrid(){\n  const g=$(\"theme-grid\"); if(!g) return;\n  const cur=document.documentElement.getAttribute(\"data-theme\");\n  g.innerHTML=TEMAS.map(t=>`<button class=\"theme-card ${t.id===cur?'on':''}\" data-tema=\"${t.id}\">\n    <div class=\"nm\">${t.n}<\u002Fdiv><div class=\"theme-dots\">${t.dots.map(d=>`<i style=\"background:${d}\"><\u002Fi>`).join(\"\")}<\u002Fdiv><\u002Fbutton>`).join(\"\");\n  g.querySelectorAll(\"[data-tema]\").forEach(b=>b.onclick=()=>setTheme(b.dataset.tema));\n}\nasync function setTheme(t){\n  applyTheme(t); try{ localStorage.setItem(\"theme\",t); }catch(e){}\n  if(user){ await sb.from(\"profiles\").upsert({user_id:user.id, tema:t},{onConflict:\"user_id\"}); if(PROFILE) PROFILE.tema=t; renderCharts(); }\n}\n$(\"theme-reset\").onclick=()=>setTheme(TEMA_DEFAULT);\n\nif(!configured()){ show(\"setup\"); }\nelse{\n  sb=supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth: { flowType:'implicit', detectSessionInUrl:true, persistSession:true, autoRefreshToken:true } });\n  fillCats([\"m-cat\",\"c-cat\",\"r-cat\",\"e-cat\"]);\n  fillPaisSelect(\"au-pais\",\"AR\"); fillPaisSelect(\"pf-pais\",\"AR\"); fillMonedaSelect(\"acc-moneda\", DEFAULT_CUR);\n  paisHint(\"au-pais\",\"au-cur-hint\"); paisHint(\"pf-pais\",\"pf-cur-hint\");\n  $(\"au-pais\").onchange=()=>paisHint(\"au-pais\",\"au-cur-hint\");\n  $(\"pf-pais\").onchange=()=>paisHint(\"pf-pais\",\"pf-cur-hint\");\n  $(\"m-fecha\").value=todayISO(); $(\"c-fecha\").value=todayISO(); $(\"se-fecha\").value=todayISO();\n  sb.auth.getSession().then(({data})=>{ if(recoveryMode) show(\"recovery\"); else onSession(data.session); });\n  sb.auth.onAuthStateChange((event,s)=>{ if(event===\"PASSWORD_RECOVERY\"){ recoveryMode=true; show(\"recovery\"); return; } if(recoveryMode && event!==\"SIGNED_OUT\") return; onSession(s); });\n}\nfunction paisHint(selId, hintId){ const p=PAIS_MAP[$(selId).value]; if(p) $(hintId).textContent=\"Tu moneda va a ser: \"+monedaLabel(p.cur); }\nfunction fillCats(ids){ ids.forEach(id=>{ const s=$(id); if(!s) return; const prev=s.value; s.innerHTML=\"\";\n  CATS.forEach(c=>{ const o=document.createElement(\"option\"); o.value=c.nombre; o.textContent=(c.emoji?c.emoji+\" \":\"\")+c.nombre; s.appendChild(o); });\n  if([...s.options].some(o=>o.value===prev)) s.value=prev; }); }\n\n// AUTH\nlet authMode=\"login\";\nfunction renderAuthMode(){ $(\"auth-title\").textContent=authMode===\"login\"?\"Ingresá\":\"Crear cuenta\"; $(\"au-submit\").textContent=authMode===\"login\"?\"Entrar\":\"Crear cuenta\";\n  $(\"au-switch-txt\").textContent=authMode===\"login\"?\"¿Primera vez?\":\"¿Ya tenés cuenta?\"; $(\"au-switch\").textContent=authMode===\"login\"?\"Crear cuenta\":\"Ingresá\"; $(\"au-err\").textContent=\"\";\n  $(\"au-pais-wrap\").classList.toggle(\"hidden\", authMode!==\"signup\"); }\n$(\"au-switch\").onclick=()=>{ authMode=authMode===\"login\"?\"signup\":\"login\"; renderAuthMode(); };\n$(\"au-forgot\").onclick=async()=>{ const email=$(\"au-email\").value.trim(), e=$(\"au-err\");\n  if(!email){ e.style.color=\"var(--expense)\"; e.textContent=\"Escribí tu email arriba y volvé a tocar.\"; return; }\n  const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:window.location.origin+window.location.pathname});\n  if(error){ e.style.color=\"var(--expense)\"; e.textContent=trad(error.message); } else { e.style.color=\"var(--muted)\"; e.textContent=\"Te mandamos un mail para cambiar la clave.\"; } };\n$(\"rc-save\").onclick=async()=>{ const pass=$(\"rc-pass\").value; if(pass.length<6){ $(\"rc-err\").textContent=\"Mínimo 6 caracteres.\"; return; }\n  $(\"rc-save\").disabled=true; const {error}=await sb.auth.updateUser({password:pass}); $(\"rc-save\").disabled=false;\n  if(error){ $(\"rc-err\").textContent=trad(error.message); return; }\n  recoveryMode=false; try{ history.replaceState(null,\"\",window.location.pathname); }catch(e){} const {data}=await sb.auth.getSession(); onSession(data.session); };\n$(\"au-submit\").onclick=async()=>{ const email=$(\"au-email\").value.trim(), pass=$(\"au-pass\").value;\n  if(!email||!pass){ $(\"au-err\").textContent=\"Completá email y contraseña.\"; return; } $(\"au-submit\").disabled=true;\n  try{\n    let res;\n    if(authMode===\"login\"){ res=await sb.auth.signInWithPassword({email,password:pass}); }\n    else{\n      const p=PAIS_MAP[$(\"au-pais\").value]||PAIS_MAP.AR;\n      res=await sb.auth.signUp({email, password:pass, options:{ data:{ pais:p.c, moneda:p.cur } }});\n    }\n    if(res.error) throw res.error;\n    if(authMode===\"signup\" && !res.data.session){ $(\"au-err\").style.color=\"var(--muted)\"; $(\"au-err\").textContent=\"Cuenta creada. Confirmá tu mail y después ingresá.\"; }\n  }catch(err){ $(\"au-err\").style.color=\"var(--expense)\"; $(\"au-err\").textContent=trad(err.message); } finally{ $(\"au-submit\").disabled=false; } };\nfunction trad(m){ if(/Invalid login/i.test(m)) return \"Email o contraseña incorrectos.\"; if(/already registered/i.test(m)) return \"Ese email ya tiene cuenta. Ingresá.\";\n  if(/at least 6/i.test(m)) return \"La contraseña necesita al menos 6 caracteres.\"; if(/Email not confirmed/i.test(m)) return \"Falta confirmar tu mail.\"; return m; }\nasync function onSession(s){ if(s&&s.user){ user=s.user; show(\"app\"); await loadAll(); } else { user=null; renderAuthMode(); show(\"auth\"); } }\n\n// DATA\nasync function loadAll(){\n  await sb.from(\"profiles\").upsert({user_id:user.id, email:user.email},{onConflict:\"user_id\"});\n  const [t,p,i,b,r,tr,pa,st,ca,pr,ac,cat]=await Promise.all([\n    sb.from(\"transactions\").select(\"*\").order(\"fecha\",{ascending:false}),\n    sb.from(\"card_purchases\").select(\"*\").order(\"fecha_compra\",{ascending:false}),\n    sb.from(\"card_installments\").select(\"*\").order(\"mes\",{ascending:true}),\n    sb.from(\"budgets\").select(\"*\"),\n    sb.from(\"recurring\").select(\"*\").order(\"created_at\",{ascending:true}),\n    sb.from(\"transfers\").select(\"*\").order(\"fecha\",{ascending:false}),\n    sb.from(\"shared_pairs\").select(\"*\").order(\"created_at\",{ascending:true}),\n    sb.from(\"shared_txns\").select(\"*\").order(\"fecha\",{ascending:false}),\n    sb.from(\"cards\").select(\"*\").order(\"created_at\",{ascending:true}),\n    sb.from(\"profiles\").select(\"*\").eq(\"user_id\",user.id).maybeSingle(),\n    sb.from(\"accounts\").select(\"*\").order(\"created_at\",{ascending:true}),\n    sb.from(\"categories\").select(\"*\").order(\"orden\",{ascending:true}),\n  ]);\n  TX=t.data||[]; PURCH=p.data||[]; INST=i.data||[]; BUD=b.data||[]; REC=r.data||[]; TRF=tr.data||[]; PAIRS=pa.data||[]; STXN=st.data||[]; CARDS=ca.data||[]; PROFILE=pr.data||null; ACCOUNTS=ac.data||[];\n  await syncCategorias(cat.data||[]);\n  if(PROFILE && PROFILE.tema) applyTheme(PROFILE.tema); else renderThemeGrid();\n\n  // Cuenta NUEVA: el país/moneda elegido al registrarse viaja en user_metadata.\n  // Cuenta VIEJA: no tiene metadata -> no se toca nada, sigue en ARS como siempre.\n  const meta = (user && user.user_metadata) || {};\n  if(PROFILE && !PROFILE.moneda && meta.moneda && MON_MAP[meta.moneda]){\n    await sb.from(\"profiles\").update({pais: meta.pais||null, moneda: meta.moneda}).eq(\"user_id\", user.id);\n    PROFILE.pais = meta.pais||null; PROFILE.moneda = meta.moneda;\n  }\n\n  if(!ACCOUNTS.length){ await sb.from(\"accounts\").insert([\n      {user_id:user.id,key:\"mercadopago\",nombre:\"MercadoPago\",moneda:mainCur()},\n      {user_id:user.id,key:\"santander\",nombre:\"Santander\",moneda:mainCur()}]);\n    const {data}=await sb.from(\"accounts\").select(\"*\").order(\"created_at\",{ascending:true}); ACCOUNTS=data||[]; }\n  CTA_NOMBRE={}; ACCOUNTS.forEach(a=>{ CTA_NOMBRE[a.key]=a.nombre; });\n  const otherIds=[...new Set(PAIRS.map(p=> p.a===user.id?p.b:p.a))];\n  OTHERPROF={}; if(otherIds.length){ const {data}=await sb.rpc(\"perfiles_de\",{ids:otherIds}); (data||[]).forEach(x=>{ OTHERPROF[x.user_id]={apodo:x.apodo,foto_url:x.foto_url}; }); }\n  fillMonedaSelect(\"acc-moneda\", mainCur()); fillCats([\"m-cat\",\"c-cat\",\"r-cat\",\"e-cat\"]);\n  fillMonthSelect(); fillCardSelect(); fillAccountSelects(); renderAccounts(); renderMe(); montoHint();\n  renderHero(); renderMonthSummary(); renderMov(); renderCuotas(); renderCards(); renderFijos(); renderBudgets(); renderDividir(); renderCalendar(); renderCharts();\n  renderCatsList(); renderConfigMenu();\n}\n\n// ---------- CATEGORÍAS (tabla propia; los movimientos siguen guardando el nombre en texto) ----------\nasync function syncCategorias(rows){\n  let cats = rows || [];\n  if(!cats.length){\n    await sb.from(\"categories\").insert(CATS_DEFAULT.map((c,i)=>({user_id:user.id, nombre:c.nombre, emoji:c.emoji, orden:i})));\n    const {data}=await sb.from(\"categories\").select(\"*\").order(\"orden\",{ascending:true}); cats=data||[];\n  }\n  // Si en tus datos viejos hay alguna categoría que no está en la tabla, se agrega sola.\n  const usadas=new Set();\n  TX.forEach(x=>x.categoria&&usadas.add(x.categoria));\n  REC.forEach(x=>x.categoria&&usadas.add(x.categoria));\n  PURCH.forEach(x=>x.categoria&&usadas.add(x.categoria));\n  BUD.forEach(x=>x.categoria&&usadas.add(x.categoria));\n  const faltan=[...usadas].filter(n=>!cats.some(c=>c.nombre===n));\n  if(faltan.length){\n    const base=cats.length;\n    const conEmoji=n=>{ const d=CATS_DEFAULT.find(x=>x.nombre===n); return d?d.emoji:null; };\n    await sb.from(\"categories\").insert(faltan.map((n,i)=>({user_id:user.id, nombre:n, emoji:conEmoji(n), orden:base+i})));\n    const {data}=await sb.from(\"categories\").select(\"*\").order(\"orden\",{ascending:true}); cats=data||cats;\n  }\n  CATS = cats.length ? cats.map(c=>({id:c.id, nombre:c.nombre, emoji:c.emoji||\"\"})) : CATS_DEFAULT.slice();\n}\nfunction catEnUso(nombre){\n  return TX.some(x=>x.categoria===nombre) || REC.some(x=>x.categoria===nombre)\n      || PURCH.some(x=>x.categoria===nombre) || BUD.some(x=>x.categoria===nombre && Number(x.monto)>0);\n}\nfunction renderCatsList(){\n  const el=$(\"cats-list\"); if(!el) return;\n  const q=($(\"cat-search\").value||\"\").toLowerCase();\n  const rows=CATS.filter(c=>c.nombre.toLowerCase().includes(q));\n  if(!rows.length){ el.innerHTML='<div class=\"empty\">No hay categorías con ese nombre.<\u002Fdiv>'; return; }\n  el.innerHTML=rows.map(c=>{ const uso=catEnUso(c.nombre);\n    return `<div class=\"item\"><div style=\"font-size:20px; width:30px; text-align:center\">${c.emoji||\"·\"}<\u002Fdiv>\n      <div class=\"meta\"><div class=\"desc\">${esc(c.nombre)}<\u002Fdiv><div class=\"subm\">${uso?\"En uso en tus movimientos\":\"Sin usar\"}<\u002Fdiv><\u002Fdiv>\n      <button class=\"iconx\" data-cat-edit=\"${c.id}\" title=\"Editar\">${icon('editar',18)}<\u002Fbutton>\n      <button class=\"iconx\" data-cat-del=\"${c.id}\" title=\"${uso?'No se puede borrar: está en uso':'Borrar'}\" ${uso?'style=\"opacity:.35\"':''}>${icon('borrar',18)}<\u002Fbutton><\u002Fdiv>`; }).join(\"\");\n  el.querySelectorAll(\"[data-cat-edit]\").forEach(b=>b.onclick=()=>editCat(b.dataset.catEdit));\n  el.querySelectorAll(\"[data-cat-del]\").forEach(b=>b.onclick=()=>delCat(b.dataset.catDel));\n}\n$(\"cat-search\").addEventListener(\"input\", renderCatsList);\n$(\"cat-add\").onclick=async()=>{\n  const nombre=$(\"cat-nombre\").value.trim(), emoji=$(\"cat-emoji\").value.trim();\n  if(!nombre){ alert(\"Poné un nombre.\"); return; }\n  if(CATS.some(c=>c.nombre.toLowerCase()===nombre.toLowerCase())){ alert(\"Ya tenés una categoría con ese nombre.\"); return; }\n  const {error}=await sb.from(\"categories\").insert({user_id:user.id, nombre, emoji:emoji||null, orden:CATS.length});\n  if(error){ alert(\"Error: \"+error.message); return; }\n  $(\"cat-nombre\").value=\"\"; $(\"cat-emoji\").value=\"\"; await loadAll(); openConfig(\"cats\");\n};\nasync function editCat(id){\n  const c=CATS.find(x=>x.id===id); if(!c) return;\n  const emoji=prompt(\"Emoji para “\"+c.nombre+\"” (dejalo vacío para sacarlo):\", c.emoji||\"\");\n  if(emoji===null) return;\n  const nombre=prompt(\"Nombre de la categoría:\", c.nombre);\n  if(nombre===null) return;\n  const nuevo=nombre.trim(); if(!nuevo){ alert(\"El nombre no puede quedar vacío.\"); return; }\n  if(nuevo!==c.nombre){\n    if(CATS.some(x=>x.id!==id && x.nombre.toLowerCase()===nuevo.toLowerCase())){ alert(\"Ya existe otra categoría con ese nombre.\"); return; }\n    if(catEnUso(c.nombre) && !confirm(`“${c.nombre}” está en uso. Al renombrarla, tus movimientos van a pasar a llamarse “${nuevo}”. Los montos no cambian. ¿Seguimos?`)) return;\n    for(const tabla of [\"transactions\",\"recurring\",\"card_purchases\",\"budgets\"]){\n      await sb.from(tabla).update({categoria:nuevo}).eq(\"categoria\",c.nombre).eq(\"user_id\",user.id);\n    }\n  }\n  const {error}=await sb.from(\"categories\").update({nombre:nuevo, emoji:emoji.trim()||null}).eq(\"id\",id);\n  if(error){ alert(\"Error: \"+error.message); return; }\n  await loadAll(); openConfig(\"cats\");\n}\nasync function delCat(id){\n  const c=CATS.find(x=>x.id===id); if(!c) return;\n  if(catEnUso(c.nombre)){ alert(`No se puede borrar “${c.nombre}”: ya tenés movimientos con esa categoría. Podés renombrarla con el lápiz.`); return; }\n  if(CATS.length<=1){ alert(\"Dejá al menos una categoría.\"); return; }\n  if(!confirm(`¿Borrar la categoría “${c.nombre}”?`)) return;\n  await sb.from(\"categories\").delete().eq(\"id\",id); await loadAll(); openConfig(\"cats\");\n}\n\n// ---------- pantalla de Configuración ----------\nlet cfgView=\"menu\";\nconst CFG_TITULOS={menu:\"Configuración\", cats:\"Categorías\", bal:\"Mi balance\", cards:\"Mis tarjetas\", fijos:\"Mis fijos\", colors:\"Colores\"};\nfunction openConfig(v){\n  cfgView=v||\"menu\"; goto(\"config\");\n  [\"menu\",\"cats\",\"bal\",\"cards\",\"fijos\",\"colors\"].forEach(k=>$(\"cfg-\"+k).classList.toggle(\"hidden\", k!==cfgView));\n  $(\"cfg-title\").textContent=CFG_TITULOS[cfgView]||\"Configuración\";\n  if(cfgView===\"menu\") renderConfigMenu();\n  if(cfgView===\"colors\") renderThemeGrid();\n  if(cfgView===\"cats\") renderCatsList();\n}\nfunction closeConfig(){ goto(\"app\"); }\nfunction renderConfigMenu(){\n  if(!$(\"cfg-cats-sub\")) return;\n  $(\"cfg-cats-sub\").textContent = CATS.length+(CATS.length===1?\" categoría\":\" categorías\");\n  $(\"cfg-bal-sub\").textContent  = ACCOUNTS.length+(ACCOUNTS.length===1?\" cuenta\":\" cuentas\")+\" · moneda principal \"+mainCur();\n  $(\"cfg-cards-sub\").textContent= CARDS.length? CARDS.length+(CARDS.length===1?\" tarjeta\":\" tarjetas\") : \"Ninguna todavía\";\n  $(\"cfg-fijos-sub\").textContent= REC.length? REC.length+(REC.length===1?\" plantilla\":\" plantillas\") : \"Ninguna todavía\";\n  const t=TEMAS.find(x=>x.id===document.documentElement.getAttribute(\"data-theme\"));\n  $(\"cfg-colors-sub\").textContent = t? t.n : \"—\";\n}\n$(\"config-btn\").onclick=()=>openConfig(\"menu\");\n$(\"cfg-back\").onclick=()=>{ if(cfgView===\"menu\") closeConfig(); else openConfig(\"menu\"); };\ndocument.querySelectorAll(\"[data-cfg]\").forEach(b=>b.onclick=()=>openConfig(b.dataset.cfg));\n\n// ---------- selector de mes del header ----------\nfunction fillMonthSelect(){\n  const s=$(\"hm-mes\"); if(!s) return;\n  const hoy=new Date(); const ops=[];\n  for(let k=-36;k<=12;k++){ const d=new Date(hoy.getFullYear(),hoy.getMonth()+k,1); ops.push(d.toISOString().slice(0,7)); }\n  if(!ops.includes(VMONTH)) ops.push(VMONTH);\n  ops.sort();\n  s.innerHTML=ops.map(m=>`<option value=\"${m}\">${mesLargo(m+\"-01\")}<\u002Foption>`).join(\"\");\n  s.value=VMONTH;\n}\nfunction setMonth(m){ VMONTH=m; calDay=null; fillMonthSelect(); renderMonthly(); }\nfunction renderMonthly(){ renderHero(); renderMonthSummary(); renderBudgets(); renderCalendar(); renderCharts(); if(!$(\"detail\").classList.contains(\"hidden\")) renderDetail(); }\n$(\"hm-mes\").onchange=()=>setMonth($(\"hm-mes\").value);\n\n// ---------- barra inferior ----------\ndocument.querySelectorAll(\".botnav button\").forEach(b=>{ b.onclick=()=>{\n  homeTab=b.dataset.tab;\n  document.querySelectorAll(\".botnav button\").forEach(x=>x.classList.toggle(\"active\", x===b));\n  [\"home\",\"tar\",\"div\",\"graf\"].forEach(t=>$(\"tab-\"+t).classList.toggle(\"hidden\", t!==homeTab));\n  goto(\"app\");\n}; });\n\n// ================== REGISTRO: calculadora + detalle ==================\nconst REG_TIPOS=[\n  {k:\"gasto\",   n:\"Gastos\",   ic:\"gasto\",   col:\"var(--expense)\", cap:\"Valor del gasto:\"},\n  {k:\"tarjeta\", n:\"Tarjetas\", ic:\"tarjeta\", col:\"var(--debt)\",    cap:\"Valor de la compra:\"},\n  {k:\"ingreso\", n:\"Ingresos\", ic:\"ingreso\", col:\"var(--income)\",  cap:\"Valor del ingreso:\"},\n  {k:\"ahorro\",  n:\"Ahorros\",  ic:\"billetera\",   col:\"var(--debt)\",    cap:\"Valor del ahorro:\"},\n  {k:\"compartido\", n:\"Compartido\", ic:\"dividir\", col:\"var(--transfer)\", cap:\"Valor del gasto compartido:\"}\n];\nconst CAT_AHORRO=\"Ahorro\";\nlet R = {tipo:\"gasto\", buf:\"0\", acum:null, op:null, listo:false, cat:null, cuenta:null, fijo:false, fecha:todayISO(), paso:1};\n\n// el registro toma el color de la paleta activa (no un color fijo por tipo)\nfunction bufNum(){ return parseFloat((R.buf||\"0\").replace(\",\",\".\")) || 0; }\nfunction bufFmt(){\n  const [ent,dec]=(R.buf||\"0\").split(\",\");\n  const e=new Intl.NumberFormat(mainLoc(),{maximumFractionDigits:0}).format(parseInt(ent||\"0\",10)||0);\n  const sim=fmt(0).replace(/[\\d.,\\s]/g,\"\") || \"$\";\n  return sim + e + (dec!==undefined ? \",\"+dec : \"\");\n}\nfunction openReg(fechaISO, tipo){\n  R={tipo:tipo||\"gasto\", buf:\"0\", acum:null, op:null, listo:false, cat:null, cuenta:null, fijo:false,\n     fecha: fechaISO || (VMONTH===curMonth() ? todayISO() : VMONTH+\"-01\"), paso:1};\n  goto(\"reg\"); renderReg();\n}\nfunction renderReg(){\n  $(\"reg\").setAttribute(\"data-rt\", R.tipo);\n  const t=REG_TIPOS.find(x=>x.k===R.tipo);\n  $(\"reg-cap\").textContent = R.paso>1 ? (t?t.cap:\"\") : \"\";\n  $(\"reg-disp\").textContent = R.paso>1 ? fmt2(regTotal()) : bufFmt();\n  $(\"reg-del\").classList.toggle(\"hidden\", R.paso!==1);\n  $(\"reg-op\").textContent = (R.paso===1 && R.op) ? `${new Intl.NumberFormat(mainLoc()).format(R.acum)} ${({'+':'+','-':'−','*':'×','/':'÷'})[R.op]}` : \"\";\n  [\"reg-step1\",\"reg-step2\",\"reg-step3\"].forEach((id,i)=>$(id).classList.toggle(\"hidden\", i+1!==R.paso));\n  $(\"reg-tipos\").innerHTML=REG_TIPOS.map(x=>`<button class=\"chipbtn ${x.k===R.tipo?'on':''}\" data-rt=\"${x.k}\" title=\"${x.n}\"><span class=\"bi\" data-ic=\"${x.ic||'gasto'}\" data-ic-size=\"18\"><\u002Fspan><span class=\"tl\">${x.n}<\u002Fspan><\u002Fbutton>`).join(\"\");\n  pintarIconos($(\"reg-tipos\"));\n  $(\"reg-tipos\").querySelectorAll(\"[data-rt]\").forEach(b=>b.onclick=()=>{ R.tipo=b.dataset.rt; R.cat=null; renderReg(); });\n  if(R.paso===2) renderRegStep2();\n  if(R.paso===3) renderRegCatList();\n}\nfunction regTotal(){ return R.acum!==null && R.op ? aplicar(R.acum, bufNum(), R.op) : bufNum(); }\nfunction aplicar(a,b,op){ const r = op===\"+\"?a+b : op===\"-\"?a-b : op===\"*\"?a*b : (b===0?a:a/b); return Math.round(r*100)/100; }\n\n// teclado\ndocument.querySelectorAll(\"[data-k]\").forEach(b=>b.onclick=()=>{\n  const k=b.dataset.k;\n  if(R.listo){ R.buf=\"0\"; R.listo=false; }\n  if(k===\",\"){ if(!R.buf.includes(\",\")) R.buf+=\",\"; }\n  else if((R.buf.split(\",\")[1]||\"\").length<2){ R.buf = (R.buf===\"0\") ? k : R.buf+k; }\n  renderReg();\n});\n$(\"reg-del\").onclick=()=>{ R.buf = R.buf.length>1 ? R.buf.slice(0,-1) : \"0\"; if(R.buf===\"\"||R.buf===\",\") R.buf=\"0\"; renderReg(); };\ndocument.querySelectorAll(\"[data-op]\").forEach(b=>b.onclick=()=>{\n  const op=b.dataset.op;\n  if(op===\"=\"){ const r=regTotal(); R.buf=String(r).replace(\".\",\",\"); R.acum=null; R.op=null; R.listo=true; }\n  else { R.acum=regTotal(); R.op=op; R.buf=\"0\"; R.listo=false; }\n  renderReg();\n});\n$(\"reg-continuar\").onclick=()=>{\n  const total=regTotal();\n  if(!(total>0)){ alert(\"Poné un monto mayor a cero.\"); return; }\n  R.buf=String(total).replace(\".\",\",\"); R.acum=null; R.op=null;\n  if(R.tipo===\"ahorro\" && !CATS.some(c=>c.nombre===CAT_AHORRO)) R.cat=null;\n  if(R.tipo===\"ahorro\") R.cat=CAT_AHORRO;\n  if(R.tipo===\"compartido\"){\n    if(!PAIRS.length){ alert(\"Todavía no tenés a nadie con quien dividir. Agregalo en Dividir.\"); return; }\n    const monto=regTotal();\n    activePairId = activePairId || PAIRS[0].id;\n    goto(\"app\"); const nb=document.querySelector('nav [data-tab=\"div\"]'); if(nb) nb.click(); openShared(null);\n    $(\"se-monto\").value = monto>0 ? monto : \"\"; seHint();\n    return;\n  }\n  if(!R.cat) R.cat = catNames()[0];\n  if(!R.cuenta) R.cuenta = (ACCOUNTS[0]||{}).key;\n  R.paso=2; renderReg();\n};\n$(\"reg-back\").onclick=()=>{ if(R.paso===1) goto(\"app\"); else if(R.paso===3){ R.paso=2; renderReg(); } else { R.paso=1; renderReg(); } };\n\nfunction renderRegStep2(){\n  const esTarjeta = R.tipo===\"tarjeta\";\n  $(\"reg-cta-lbl\").textContent = R.tipo===\"ingreso\" ? \"Detalle del ingreso\" : (esTarjeta?\"Detalle de la compra\":\"Detalle del gasto\");\n  // categoría: chips con las últimas usadas + botón para abrir la lista completa\n  const recientes=[...new Set(TX.filter(t=>t.categoria).slice(0,40).map(t=>t.categoria))].slice(0,2);\n  const chips=[...new Set([R.cat, ...recientes].filter(Boolean))].slice(0,3);\n  $(\"reg-catpick\").innerHTML = chips.map(c=>`<button class=\"chipbtn soft ${c===R.cat?'on':''}\" data-rc=\"${esc(c)}\">${esc(catLabel(c))}<\u002Fbutton>`).join(\"\")\n    + `<button class=\"roundadd sm\" id=\"reg-cat-more\" style=\"background:var(--regcol); color:#fff\">+<\u002Fbutton>`;\n  $(\"reg-catpick\").querySelectorAll(\"[data-rc]\").forEach(b=>b.onclick=()=>{ R.cat=b.dataset.rc; renderReg(); });\n  $(\"reg-cat-more\").onclick=()=>{ R.paso=3; renderReg(); };\n  // cuentas\n  $(\"reg-cuentas\").innerHTML = ACCOUNTS.map(a=>`<button class=\"chipbtn soft ${a.key===R.cuenta?'on':''}\" data-rcu=\"${a.key}\">${esc(a.nombre)} · ${a.moneda||mainCur()}<\u002Fbutton>`).join(\"\");\n  $(\"reg-cuentas\").querySelectorAll(\"[data-rcu]\").forEach(b=>b.onclick=()=>{ R.cuenta=b.dataset.rcu; renderReg(); });\n  // tarjeta\n  $(\"reg-tarjeta-wrap\").classList.toggle(\"hidden\", !esTarjeta);\n  $(\"reg-fijo-wrap\").classList.toggle(\"hidden\", esTarjeta || R.tipo===\"ingreso\");\n  if(esTarjeta){\n    const s=$(\"reg-card\"); const prev=s.value;\n    s.innerHTML=CARDS.map(c=>`<option value=\"${c.id}\">${cardLabel(c)}<\u002Foption>`).join(\"\")+`<option value=\"\">Otra (sin registrar)<\u002Foption>`;\n    if([...s.options].some(o=>o.value===prev)) s.value=prev;\n    const n=parseInt($(\"reg-cuotas\").value)||1;\n    $(\"reg-cuotas-prev\").textContent = n>1 ? `${n} cuotas de ${fmt2(regTotal()/n)}` : \"Un solo pago\";\n  }\n  document.querySelectorAll(\"[data-fijo]\").forEach(b=>b.classList.toggle(\"on\", (b.dataset.fijo===\"1\")===R.fijo));\n  $(\"reg-fijo-note\").textContent = R.fijo ? \"Además se guarda como plantilla en Mis fijos, para repetirlo cada mes.\" : \"\";\n  $(\"reg-fecha\").value=R.fecha;\n  const hoy=todayISO(); const ay=new Date(); ay.setDate(ay.getDate()-1); const ayer=ay.toISOString().slice(0,10);\n  document.querySelectorAll(\"[data-fecha]\").forEach(b=>{\n    const on = b.dataset.fecha===\"hoy\" ? R.fecha===hoy : b.dataset.fecha===\"ayer\" ? R.fecha===ayer : (R.fecha!==hoy && R.fecha!==ayer);\n    b.classList.toggle(\"on\", on); });\n}\ndocument.querySelectorAll(\"[data-fijo]\").forEach(b=>b.onclick=()=>{ R.fijo = b.dataset.fijo===\"1\"; renderReg(); });\ndocument.querySelectorAll(\"[data-fecha]\").forEach(b=>b.onclick=()=>{\n  if(b.dataset.fecha===\"hoy\") R.fecha=todayISO();\n  else if(b.dataset.fecha===\"ayer\"){ const d=new Date(); d.setDate(d.getDate()-1); R.fecha=d.toISOString().slice(0,10); }\n  else { $(\"reg-fecha\").showPicker ? $(\"reg-fecha\").showPicker() : $(\"reg-fecha\").focus(); return; }\n  renderReg(); });\n$(\"reg-fecha\").onchange=()=>{ if($(\"reg-fecha\").value){ R.fecha=$(\"reg-fecha\").value; renderReg(); } };\n$(\"reg-cuotas\").addEventListener(\"input\", ()=>{ if(R.paso===2) renderRegStep2(); });\n\n// paso 3: lista completa de categorías\nfunction renderRegCatList(){\n  const q=($(\"reg-cat-search\").value||\"\").toLowerCase();\n  const rows=CATS.filter(c=>c.nombre.toLowerCase().includes(q));\n  $(\"reg-cat-list\").innerHTML = rows.length ? rows.map(c=>`<div class=\"item\" data-pick=\"${esc(c.nombre)}\">\n    <div style=\"font-size:21px; width:32px; text-align:center\">${c.emoji||\"·\"}<\u002Fdiv>\n    <div class=\"meta\"><div class=\"desc\">${esc(c.nombre)}<\u002Fdiv><\u002Fdiv>\n    <button class=\"iconx\" data-rcat-edit=\"${c.id}\">${icon('editar',18)}<\u002Fbutton><\u002Fdiv>`).join(\"\")\n    : '<div class=\"empty\">No hay categorías con ese nombre. Tocá + para crear una.<\u002Fdiv>';\n  $(\"reg-cat-list\").querySelectorAll(\"[data-pick]\").forEach(el=>el.onclick=e=>{\n    if(e.target.closest(\"[data-rcat-edit]\")) return; R.cat=el.dataset.pick; R.paso=2; renderReg(); });\n  $(\"reg-cat-list\").querySelectorAll(\"[data-rcat-edit]\").forEach(b=>b.onclick=async e=>{ e.stopPropagation(); await editCat(b.dataset.rcatEdit); });\n}\n$(\"reg-cat-search\").addEventListener(\"input\", renderRegCatList);\n$(\"reg-cat-new\").onclick=async()=>{\n  const emoji=prompt(\"Emoji de la categoría (opcional):\",\"\"); if(emoji===null) return;\n  const nombre=prompt(\"Nombre de la categoría:\",\"\"); if(nombre===null) return;\n  const n=nombre.trim(); if(!n){ alert(\"Poné un nombre.\"); return; }\n  if(CATS.some(c=>c.nombre.toLowerCase()===n.toLowerCase())){ alert(\"Ya existe esa categoría.\"); return; }\n  const {error}=await sb.from(\"categories\").insert({user_id:user.id, nombre:n, emoji:emoji.trim()||null, orden:CATS.length});\n  if(error){ alert(\"Error: \"+error.message); return; }\n  await loadAll(); R.cat=n; R.paso=2; goto(\"reg\"); renderReg();\n};\n\n// guardar\n$(\"reg-listo\").onclick=async()=>{\n  const total=regTotal(); if(!(total>0)){ alert(\"Monto inválido.\"); return; }\n  $(\"reg-listo\").disabled=true;\n  try{\n    if(R.tipo===\"tarjeta\"){\n      const n=Math.max(1, parseInt($(\"reg-cuotas\").value)||1);\n      const sel=$(\"reg-card\"); const cardId=sel.value||null;\n      const tarjetaLabel = sel.options[sel.selectedIndex] ? sel.options[sel.selectedIndex].textContent : \"Otra\";\n      const {data,error}=await sb.from(\"card_purchases\").insert({fecha_compra:R.fecha, tarjeta:tarjetaLabel, card_id:cardId,\n        descripcion:$(\"reg-desc\").value.trim(), categoria:R.cat, monto_total:total, cuotas:n, user_id:user.id}).select().
