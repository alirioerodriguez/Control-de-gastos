ton class=\"iconx\" data-edit=\"${r.id}\">${icon('editar',18)}<\u002Fbutton><button class=\"iconx\" data-del-tx=\"${r.id}\">${icon('borrar',18)}<\u002Fbutton><\u002Fdiv>`; }).join(\"\")\n    : '<div class=\"empty\">Sin movimientos este día. Tocá + para cargar uno.<\u002Fdiv>';\n  el.querySelectorAll(\"[data-del-tx]\").forEach(b=>b.onclick=()=>delRow(\"transactions\",b.dataset.delTx));\n  el.querySelectorAll(\"[data-del-tr]\").forEach(b=>b.onclick=()=>delRow(\"transfers\",b.dataset.delTr));\n  el.querySelectorAll(\"[data-edit]\").forEach(b=>b.onclick=()=>openEdit(b.dataset.edit));\n  el.querySelectorAll(\"[data-edit-tr]\").forEach(b=>b.onclick=()=>openEditTr(b.dataset.editTr));\n}\n\n// DIVIDIR (gastos compartidos entre usuarios)\nfunction otherId(pair){ return pair.a===user.id ? pair.b : pair.a; }\nfunction otherProf(id){ return OTHERPROF[id] || {apodo:\"usuario\", foto_url:null}; }\nfunction myName(){ return (PROFILE&&PROFILE.nombre) || \"Yo\"; }\nfunction sharedDelta(t){ const m=Number(t.monto); const owed = t.dividido===\"ambos\" ? m/2 : m;\n  if(t.pagado_por===user.id) return owed; return -owed; }\nfunction pairTxns(pairId){ return STXN.filter(t=>t.pair_id===pairId); }\n\nfunction renderDividir(){\n  const net=STXN.reduce((a,t)=>a+sharedDelta(t),0);\n  $(\"div-net\").textContent=fmt(Math.abs(net)); $(\"div-net\").style.color= net>0?\"var(--income)\":(net<0?\"var(--expense)\":\"var(--ink)\");\n  $(\"div-net-lbl\").textContent= net>0?\"Te deben en total\":(net<0?\"Debés en total\":\"Estás en cero\");\n  const pl=$(\"pairs-list\");\n  if(!PAIRS.length){ pl.innerHTML='<div class=\"empty\">Todavía no compartís gastos con nadie.<\u002Fdiv>'; $(\"pair-detail\").classList.add(\"hidden\"); }\n  else{\n    pl.innerHTML=PAIRS.map(p=>{ const oid=otherId(p); const op=otherProf(oid); const bal=pairTxns(p.id).reduce((a,t)=>a+sharedDelta(t),0);\n      const txt=bal>0?`Te debe ${fmt(bal)}`:(bal<0?`Le debés ${fmt(-bal)}`:\"Al día\");\n      return `<div class=\"contact-row\"><div class=\"avatar\">${avatarInner(op.foto_url,op.apodo)}<\u002Fdiv>\n        <div class=\"meta\"><div class=\"desc\">${esc(op.apodo)}<\u002Fdiv><div class=\"subm\">${txt}<\u002Fdiv><\u002Fdiv>\n        <button class=\"btn ghost sm\" data-open-pair=\"${p.id}\">Ver<\u002Fbutton>\n        <button class=\"iconx\" data-del-pair=\"${p.id}\">${icon('borrar',18)}<\u002Fbutton><\u002Fdiv>`; }).join(\"\");\n    pl.querySelectorAll(\"[data-open-pair]\").forEach(b=>b.onclick=()=>{ activePairId=b.dataset.openPair; renderPairDetail(); });\n    pl.querySelectorAll(\"[data-del-pair]\").forEach(b=>b.onclick=()=>delPair(b.dataset.delPair));\n    if(activePairId && PAIRS.some(p=>p.id===activePairId)) renderPairDetail(); else $(\"pair-detail\").classList.add(\"hidden\");\n  }\n}\nfunction renderPairDetail(){\n  const p=PAIRS.find(x=>x.id===activePairId); if(!p){ $(\"pair-detail\").classList.add(\"hidden\"); return; }\n  const op=otherProf(otherId(p)); $(\"pair-detail\").classList.remove(\"hidden\"); $(\"pair-title\").textContent=\"Gastos con \"+op.apodo;\n  const txns=pairTxns(p.id); const bal=txns.reduce((a,t)=>a+sharedDelta(t),0);\n  const bl=$(\"pair-balance\"); bl.textContent= bal>0?`${op.apodo} te debe ${fmt(bal)}`:(bal<0?`Le debés ${fmt(-bal)} a ${op.apodo}`:\"Están al día\");\n  bl.style.color= bal>0?\"var(--income)\":(bal<0?\"var(--expense)\":\"var(--muted)\"); bl.style.fontWeight=\"700\";\n  const el=$(\"pair-txns\");\n  el.innerHTML = txns.length ? txns.map(t=>{ const d=sharedDelta(t); const payer = t.pagado_por===user.id?myName():op.apodo;\n    const sub = `${fechaCorta(t.fecha)} · pagó ${esc(payer)} · ${t.dividido===\"ambos\"?\"mitad y mitad\":\"entero\"}`;\n    const col=d>0?\"var(--income)\":(d<0?\"var(--expense)\":\"var(--muted)\"); const txt=d>0?`+${fmt(d)}`:(d<0?`−${fmt(-d)}`:fmt(0));\n    return `<div class=\"item\"><div class=\"meta\"><div class=\"desc\">${esc(t.titulo)} <span class=\"badge\">${fmt(t.monto)}<\u002Fspan><\u002Fdiv><div class=\"subm\">${sub}<\u002Fdiv><\u002Fdiv>\n      <div class=\"amt num\" style=\"color:${col}\">${txt}<\u002Fdiv>\n      <button class=\"iconx\" data-edit-sh=\"${t.id}\">${icon('editar',18)}<\u002Fbutton><button class=\"iconx\" data-del-sh=\"${t.id}\">${icon('borrar',18)}<\u002Fbutton><\u002Fdiv>`; }).join(\"\")\n    : '<div class=\"empty\">Sin gastos todavía.<\u002Fdiv>';\n  el.querySelectorAll(\"[data-edit-sh]\").forEach(b=>b.onclick=()=>openShared(b.dataset.editSh));\n  el.querySelectorAll(\"[data-del-sh]\").forEach(b=>b.onclick=async()=>{ if(confirm(\"¿Borrar este gasto compartido?\")){ await sb.from(\"shared_txns\").delete().eq(\"id\",b.dataset.delSh); await loadAll(); renderPairDetail(); } });\n}\nasync function delPair(id){ if(!confirm(\"¿Dejar de compartir? Se borran los gastos compartidos con esa persona.\")) return; await sb.from(\"shared_pairs\").delete().eq(\"id\",id); if(activePairId===id) activePairId=null; await loadAll(); }\n\n// buscar/vincular por email\n$(\"link-search\").onclick=async()=>{ const email=$(\"link-email\").value.trim(); const box=$(\"link-result\"); if(!email){ box.innerHTML='<div class=\"hint\">Escribí un mail.<\u002Fdiv>'; return; }\n  box.innerHTML='<div class=\"hint\">Buscando…<\u002Fdiv>'; const {data,error}=await sb.rpc(\"buscar_usuario\",{p_email:email});\n  if(error){ box.innerHTML='<div class=\"hint\" style=\"color:var(--expense)\">'+esc(error.message)+'<\u002Fdiv>'; return; }\n  const found=(data&&data[0])||null;\n  if(!found){ box.innerHTML='<div class=\"hint\">No encontré a nadie con ese mail. ¿Ya se registró y entró una vez?<\u002Fdiv>'; return; }\n  if(found.user_id===user.id){ box.innerHTML='<div class=\"hint\">Ese sos vos 🙂<\u002Fdiv>'; return; }\n  if(PAIRS.some(p=>otherId(p)===found.user_id)){ box.innerHTML='<div class=\"hint\">Ya compartís gastos con esta persona.<\u002Fdiv>'; return; }\n  linkFound=found;\n  box.innerHTML=`<div class=\"contact-row\"><div class=\"avatar\">${avatarInner(null,found.apodo)}<\u002Fdiv>\n    <div class=\"meta\"><div class=\"desc\">${esc(found.apodo||\"(sin apodo)\")}<\u002Fdiv><div class=\"subm\">${esc(email)}<\u002Fdiv><\u002Fdiv>\n    <button class=\"btn sm\" id=\"link-confirm\">Vincular<\u002Fbutton><\u002Fdiv>`;\n  $(\"link-confirm\").onclick=async()=>{ const {error}=await sb.from(\"shared_pairs\").insert({a:user.id,b:linkFound.user_id}); if(error){ alert(\"Error: \"+error.message); return; }\n    $(\"link-email\").value=\"\"; box.innerHTML='<div class=\"hint\" style=\"color:var(--income)\">¡Listo! Ya comparten gastos.<\u002Fdiv>'; await loadAll(); };\n};\n\n// modal gasto compartido (crear/editar)\nfunction fillPagador(){ const p=PAIRS.find(x=>x.id===activePairId); if(!p) return; const op=otherProf(otherId(p));\n  $(\"se-pagador\").innerHTML=`<option value=\"${user.id}\">${esc(myName())}<\u002Foption><option value=\"${otherId(p)}\">${esc(op.apodo)}<\u002Foption>`; }\nfunction seHint(){ const m=parseFloat($(\"se-monto\").value)||0; const p=PAIRS.find(x=>x.id===activePairId); if(!p) return; const op=otherProf(otherId(p));\n  const d=sharedDelta({monto:m,pagado_por:$(\"se-pagador\").value,dividido:$(\"se-dividido\").value});\n  $(\"se-hint\").textContent = d>0?`${op.apodo} te va a deber ${fmt2(d)}`:(d<0?`Le vas a deber ${fmt2(-d)} a ${op.apodo}`:\"No genera deuda\"); }\nfunction openShared(txnId){\n  if(!activePairId){ alert(\"Abrí un contacto primero.\"); return; }\n  fillPagador(); editingShared=txnId||null;\n  if(txnId){ const t=STXN.find(x=>x.id===txnId); if(!t) return; $(\"se-title\").textContent=\"Editar gasto compartido\";\n    $(\"se-titulo\").value=t.titulo; $(\"se-monto\").value=t.monto; $(\"se-pagador\").value=t.pagado_por; $(\"se-dividido\").value=t.dividido; $(\"se-fecha\").value=t.fecha;\n  } else { $(\"se-title\").textContent=\"Gasto compartido\"; $(\"se-titulo\").value=\"\"; $(\"se-monto\").value=\"\"; $(\"se-dividido\").value=\"ambos\"; $(\"se-fecha\").value=todayISO(); $(\"se-pagador\").value=user.id; }\n  seHint(); $(\"shared-overlay\").classList.remove(\"hidden\");\n}\n$(\"add-shared-btn\").onclick=()=>openShared(null);\n$(\"se-cancel\").onclick=()=>$(\"shared-overlay\").classList.add(\"hidden\");\n$(\"shared-overlay\").onclick=e=>{ if(e.target.id===\"shared-overlay\") $(\"shared-overlay\").classList.add(\"hidden\"); };\n[\"se-monto\",\"se-pagador\",\"se-dividido\"].forEach(id=>$(id).addEventListener(\"input\",seHint));\n$(\"se-save\").onclick=async()=>{ const titulo=$(\"se-titulo\").value.trim(), monto=parseFloat($(\"se-monto\").value);\n  if(!titulo){ alert(\"Poné un título.\"); return; } if(!(monto>0)){ alert(\"Monto inválido.\"); return; } $(\"se-save\").disabled=true;\n  const payload={fecha:$(\"se-fecha\").value||todayISO(), titulo, monto, pagado_por:$(\"se-pagador\").value, dividido:$(\"se-dividido\").value};\n  let error;\n  if(editingShared){ ({error}=await sb.from(\"shared_txns\").update(payload).eq(\"id\",editingShared)); }\n  else { ({error}=await sb.from(\"shared_txns\").insert({...payload, pair_id:activePairId, created_by:user.id})); }\n  $(\"se-save\").disabled=false; if(error){ alert(\"Error: \"+error.message); return; }\n  $(\"shared-overlay\").classList.add(\"hidden\"); editingShared=null; await loadAll(); renderPairDetail(); };\n\n// FIJOS\n$(\"r-add\").onclick=async()=>{ const monto=parseFloat($(\"r-monto\").value); if(!(monto>0)){ alert(\"Monto inválido.\"); return; }\n  const {error}=await sb.from(\"recurring\").insert({cuenta:$(\"r-cuenta\").value,tipo:$(\"r-tipo\").value,monto,categoria:$(\"r-cat\").value,descripcion:$(\"r-desc\").value.trim(),user_id:user.id});\n  if(error){ alert(\"Error: \"+error.message); return; } $(\"r-monto\").value=\"\"; $(\"r-desc\").value=\"\"; await loadAll(); };\nfunction renderFijos(){ const el=$(\"fijos-list\"); if(!REC.length){ el.innerHTML='<div class=\"empty\">Todavía no cargaste fijos.<\u002Fdiv>'; $(\"fijos-total\").textContent=\"\"; return; }\n  el.innerHTML=REC.map(r=>{ const isIn=r.tipo===\"ingreso\"; return `<div class=\"item\"><div class=\"meta\"><div class=\"desc\">${esc(r.descripcion)||r.categoria||\"Fijo\"}<\u002Fdiv>\n    <div class=\"subm\">${CTA_NOMBRE[r.cuenta]||r.cuenta} · <span class=\"badge\">${r.categoria?esc(catLabel(r.categoria)):'—'}<\u002Fspan><\u002Fdiv><\u002Fdiv>\n    <div class=\"amt ${isIn?'in':'out'} num\">${isIn?'+':'−'}${fmt(r.monto, accCur(r.cuenta))}<\u002Fdiv>\n    <button class=\"paid-btn\" data-reg=\"${r.id}\">Registrar<\u002Fbutton><button class=\"iconx\" data-del-rec=\"${r.id}\">${icon('borrar',18)}<\u002Fbutton><\u002Fdiv>`; }).join(\"\");\n  const g=REC.filter(r=>r.tipo===\"gasto\" && esMonedaPrincipal(r.cuenta)).reduce((a,r)=>a+Number(r.monto),0),\n        i=REC.filter(r=>r.tipo===\"ingreso\" && esMonedaPrincipal(r.cuenta)).reduce((a,r)=>a+Number(r.monto),0);\n  $(\"fijos-total\").textContent=`Fijos por mes (${mainCur()}): gastos ${fmt(g)} · ingresos ${fmt(i)}`;\n  el.querySelectorAll(\"[data-reg]\").forEach(b=>b.onclick=()=>registrarFijo(b.dataset.reg));\n  el.querySelectorAll(\"[data-del-rec]\").forEach(b=>b.onclick=async()=>{ if(confirm(\"¿Borrar este fijo?\")){ await sb.from(\"recurring\").delete().eq(\"id\",b.dataset.delRec); await loadAll(); } }); }\nasync function registrarFijo(id){ const r=REC.find(x=>x.id===id); if(!r) return; await sb.from(\"transactions\").insert({fecha:todayISO(),cuenta:r.cuenta,tipo:r.tipo,monto:r.monto,categoria:r.categoria,descripcion:r.descripcion,user_id:user.id}); await loadAll(); }\n$(\"r-all\").onclick=async()=>{ if(!REC.length) return; if(!confirm(\"¿Registrar todos los fijos con fecha de hoy?\")) return; const rows=REC.map(r=>({fecha:todayISO(),cuenta:r.cuenta,tipo:r.tipo,monto:r.monto,categoria:r.categoria,descripcion:r.descripcion,user_id:user.id})); await sb.from(\"transactions\").insert(rows); await loadAll(); };\n\n// PRESUPUESTO\nfunction renderBudgets(){ const cm=VMONTH; const spent={};\n  TX.forEach(t=>{ if(t.tipo===\"gasto\" && t.fecha.slice(0,7)===cm && esMonedaPrincipal(t.cuenta)){ spent[t.categoria]=(spent[t.categoria]||0)+Number(t.monto); } });\n  const bmap=Object.fromEntries(BUD.map(b=>[b.categoria,Number(b.monto)]));\n  $(\"budget-list\").innerHTML=catNames().map(cat=>{ const lim=bmap[cat]||0, sp=spent[cat]||0; const pct=lim>0?Math.min(100,Math.round(sp/lim*100)):0; const over=lim>0&&sp>lim;\n    return `<div class=\"brow\"><div class=\"bhead\"><span class=\"bname\">${esc(catLabel(cat))}<\u002Fspan><span><input class=\"lim num\" type=\"number\" inputmode=\"decimal\" value=\"${lim||''}\" placeholder=\"0\" data-cat=\"${cat}\"><\u002Fspan><\u002Fdiv>\n      ${lim>0?`<div class=\"bar ${over?'over':''}\"><span style=\"width:${pct}%\"><\u002Fspan><\u002Fdiv><div class=\"bmeta\">${fmt(sp)} de ${fmt(lim)} ${over?'· te pasaste':`· queda ${fmt(lim-sp)}`}<\u002Fdiv>`:''}<\u002Fdiv>`; }).join(\"\");\n  $(\"budget-list\").querySelectorAll(\"input.lim\").forEach(inp=>inp.onchange=()=>saveBudget(inp.dataset.cat,inp.value)); }\nasync function saveBudget(cat,val){ const monto=parseFloat(val)||0; await sb.from(\"budgets\").upsert({user_id:user.id,categoria:cat,monto},{onConflict:\"user_id,categoria\"}); await loadAll(); }\n\n// CHARTS\nfunction axisColor(){ return cssVar('--muted')||'#888'; }\nfunction cssVar(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }\nfunction renderCharts(){\n  const gc=axisColor();\n  const months={}; TX.forEach(t=>{ if(!esMonedaPrincipal(t.cuenta)) return; const k=t.fecha.slice(0,7); (months[k] ||= {ing:0,gas:0}); if(t.tipo===\"ingreso\") months[k].ing+=Number(t.monto); else months[k].gas+=Number(t.monto); });\n  const keys=Object.keys(months).sort().slice(-6);\n  if(chartFlow) chartFlow.destroy();\n  chartFlow=new Chart($(\"chart-flow\"),{type:\"bar\",data:{labels:keys.map(mesCorto),datasets:[\n    {label:\"Ingresos\",data:keys.map(k=>months[k].ing),backgroundColor:cssVar('--income'),borderRadius:6},\n    {label:\"Gastos\",data:keys.map(k=>months[k].gas),backgroundColor:cssVar('--expense'),borderRadius:6}]},\n    options:{responsive:true,plugins:{legend:{position:\"bottom\",labels:{color:gc}}},scales:{x:{ticks:{color:gc}},y:{ticks:{color:gc,callback:v=>fmt(v)}}}}});\n  const cm=VMONTH, cats={}; TX.filter(t=>t.tipo===\"gasto\"&&t.fecha.slice(0,7)===cm&&esMonedaPrincipal(t.cuenta)).forEach(t=>{ const c=t.categoria||\"Otros\"; cats[c]=(cats[c]||0)+Number(t.monto); });\n  const ck=Object.keys(cats).sort((a,b)=>cats[b]-cats[a]); const totalGas=ck.reduce((a,c)=>a+cats[c],0);\n  if(chartCat) chartCat.destroy();\n  if(ck.length){\n    chartCat=new Chart($(\"chart-cat\"),{type:\"pie\",data:{labels:ck.map(catLabel),datasets:[{data:ck.map(c=>cats[c]),backgroundColor:ck.map((_,i)=>CAT_COLORS[i%CAT_COLORS.length]),borderWidth:0}]},\n      options:{responsive:true,plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>` ${c.label}: ${fmt(c.raw)} (${totalGas?Math.round(c.raw/totalGas*100):0}%)`}}}}});\n    $(\"cat-legend\").innerHTML=ck.map((c,i)=>{ const pct=totalGas?Math.round(cats[c]/totalGas*100):0;\n      return `<div class=\"legrow\"><span class=\"swatch\" style=\"background:${CAT_COLORS[i%CAT_COLORS.length]}\"><\u002Fspan><span class=\"lname\">${esc(catLabel(c))}<\u002Fspan><span class=\"lval\">${fmt(cats[c])} · ${pct}%<\u002Fspan><\u002Fdiv>`; }).join(\"\");\n  } else { $(\"cat-legend\").innerHTML='<div class=\"empty\">Sin gastos este mes.<\u002Fdiv>'; }\n  const proj={}, cmk=curMonth(); INST.filter(x=>!x.pagada && x.mes.slice(0,7)>=cmk).forEach(x=>{ const k=x.mes.slice(0,7); proj[k]=(proj[k]||0)+Number(x.monto); });\n  const pk=Object.keys(proj).sort().slice(0,8); if(chartProj) chartProj.destroy();\n  if(pk.length){ chartProj=new Chart($(\"chart-proj\"),{type:\"bar\",data:{labels:pk.map(mesCorto),datasets:[{label:\"A pagar\",data:pk.map(k=>proj[k]),backgroundColor:cssVar('--cardcol'),borderRadius:6}]},\n    options:{responsive:true,plugins:{legend:{display:false}},scales:{x:{ticks:{color:gc}},y:{ticks:{color:gc,callback:v=>fmt(v)}}}}});\n    $(\"proj-hint\").textContent=`Total pendiente en cuotas: ${fmt(pk.reduce((a,k)=>a+proj[k],0))}`; }\n  else $(\"proj-hint\").textContent=\"No tenés cuotas pendientes.\";\n}\n\n// helpers\nfunction esc(s){ return (s||\"\").replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c])); }\nfunction initials(n){ return (n||\"?\").trim().split(/\\s+/).slice(0,2).map(w=>w[0]).join(\"\").toUpperCase(); }\nfunction fechaCorta(iso){ return new Date(iso+\"T00:00:00\").toLocaleDateString(mainLoc(),{day:'2-digit',month:'short'}); }\nfunction mesLargo(iso){ return new Date(iso+\"T00:00:00\").toLocaleDateString(mainLoc(),{month:'long',year:'numeric'}); }\nfunction mesCorto(k){ return new Date(k+\"-01T00:00:00\").toLocaleDateString(mainLoc(),{month:'short',year:'2-digit'}); }\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
</body>
